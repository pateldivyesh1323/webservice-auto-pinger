<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Pinger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg: #0a0c12;
            --bg-2: #11141d;
            --card: rgba(23, 27, 38, 0.72);
            --card-solid: #171b26;
            --card-2: #1d2230;
            --border: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.14);
            --text: #eceef4;
            --muted: #9499ab;
            --faint: #6b7185;
            --accent: #6d8bff;
            --accent-2: #9b6bff;
            --accent-hover: #5a7bff;
            --danger: #ff5d72;
            --ok: #36d399;
            --warn: #f7b955;
            --radius: 16px;
            --radius-sm: 10px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        body {
            font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 18px 60px;
            background:
                radial-gradient(900px 500px at 85% -5%, rgba(155, 107, 255, 0.16), transparent 60%),
                radial-gradient(900px 500px at 10% 0%, rgba(109, 139, 255, 0.18), transparent 55%),
                linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 100%);
            background-attachment: fixed;
            -webkit-font-smoothing: antialiased;
        }

        .hidden { display: none !important; }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 28px;
        }
        .logo .badge {
            width: 38px; height: 38px;
            border-radius: 11px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: 0 8px 24px rgba(109, 139, 255, 0.4);
        }
        .logo .badge svg { width: 20px; height: 20px; }
        .logo .wave { color: var(--muted); font-weight: 500; font-size: 13px; display: block; }

        .card {
            position: relative;
            background: var(--card);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
            width: 100%;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.45);
        }

        #login-card { max-width: 400px; animation: rise .4s ease; }
        #app { max-width: 760px; width: 100%; animation: rise .4s ease; }

        @keyframes rise {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
        .sub { color: var(--muted); font-size: 13.5px; margin: 6px 0 22px; }

        label { display: block; font-size: 12.5px; font-weight: 500; color: var(--muted); margin-bottom: 8px; }

        .field { position: relative; }
        .field svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--faint); }
        .field input { padding-left: 42px !important; }

        input[type="password"], input[type="text"], input[type="url"] {
            width: 100%;
            background: rgba(10, 12, 18, 0.6);
            border: 1px solid var(--border-strong);
            color: var(--text);
            padding: 13px 15px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color .15s, box-shadow .15s, background .15s;
        }
        input::placeholder { color: var(--faint); }
        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(109, 139, 255, 0.18);
            background: rgba(10, 12, 18, 0.85);
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 13.5px;
            font-weight: 600;
            font-family: inherit;
            padding: 12px 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background .15s, transform .08s, opacity .15s, border-color .15s;
        }
        button:active:not(:disabled) { transform: translateY(1px); }
        button:disabled { opacity: .55; cursor: not-allowed; }
        button svg { width: 16px; height: 16px; }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: white;
            box-shadow: 0 8px 22px rgba(109, 139, 255, 0.3);
        }
        .btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
        .btn-block { width: 100%; margin-top: 18px; }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            border: 1px solid var(--border-strong);
        }
        .btn-ghost:hover:not(:disabled) { background: rgba(255, 255, 255, 0.09); }

        .btn-icon {
            background: transparent;
            color: var(--muted);
            border: 1px solid transparent;
            padding: 9px;
            border-radius: 9px;
        }
        .btn-icon:hover:not(:disabled) { background: rgba(255, 255, 255, 0.07); color: var(--text); }
        .btn-icon.danger:hover:not(:disabled) { background: rgba(255, 93, 114, 0.14); color: var(--danger); }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 22px;
        }
        .topbar h2 { font-size: 21px; }

        .stats { display: flex; gap: 10px; margin-bottom: 22px; flex-wrap: wrap; }
        .stat {
            flex: 1;
            min-width: 120px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
        }
        .stat .num { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
        .stat .lbl { font-size: 11.5px; color: var(--muted); margin-top: 6px; text-transform: uppercase; letter-spacing: 0.06em; }
        .stat.active .num { color: var(--ok); }
        .stat.paused .num { color: var(--warn); }

        .add-row { display: flex; gap: 10px; }
        .add-row .field { flex: 1; }
        .add-row button { white-space: nowrap; }

        .toolbar { display: flex; gap: 10px; margin: 20px 0 16px; align-items: center; }
        .toolbar .spacer { flex: 1; }

        ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .url-item {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid var(--border);
            border-radius: 13px;
            padding: 14px 16px;
            transition: border-color .15s, background .15s, transform .15s;
            animation: rise .3s ease;
        }
        .url-item:hover { border-color: var(--border-strong); background: rgba(255, 255, 255, 0.045); }

        .dot {
            width: 9px; height: 9px; border-radius: 50%;
            background: var(--faint);
            flex-shrink: 0;
            position: relative;
        }
        .dot.ok { background: var(--ok); box-shadow: 0 0 0 4px rgba(54, 211, 153, 0.16); }
        .dot.fail { background: var(--danger); box-shadow: 0 0 0 4px rgba(255, 93, 114, 0.16); }
        .dot.paused { background: var(--warn); box-shadow: 0 0 0 4px rgba(247, 185, 85, 0.14); }

        .url-main { flex: 1; min-width: 0; }
        .url-main .url { font-size: 14px; font-weight: 500; word-break: break-all; }
        .url-main .meta { font-size: 12px; color: var(--muted); margin-top: 3px; display: flex; align-items: center; gap: 6px; }

        .pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; }
        .pill.ok { background: rgba(54, 211, 153, 0.14); color: var(--ok); }
        .pill.fail { background: rgba(255, 93, 114, 0.14); color: var(--danger); }
        .pill.paused { background: rgba(247, 185, 85, 0.14); color: var(--warn); }

        .url-item.disabled { opacity: .62; }
        .url-item.disabled .url { text-decoration: line-through; text-decoration-color: var(--faint); }

        .switch {
            position: relative;
            width: 42px; height: 24px;
            border-radius: 99px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid var(--border-strong);
            padding: 0;
            flex-shrink: 0;
            transition: background .2s;
        }
        .switch .knob {
            position: absolute;
            top: 50%; left: 3px;
            transform: translateY(-50%);
            width: 17px; height: 17px;
            border-radius: 50%;
            background: #fff;
            transition: left .2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,.35);
        }
        .switch.on { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; }
        .switch.on .knob { left: 22px; }

        .actions { display: flex; align-items: center; gap: 4px; }

        .empty {
            text-align: center;
            padding: 44px 20px;
            color: var(--muted);
        }
        .empty svg { width: 38px; height: 38px; color: var(--faint); margin-bottom: 12px; }
        .empty .title { font-size: 15px; font-weight: 600; color: var(--text); }
        .empty .desc { font-size: 13px; margin-top: 4px; }

        .msg { font-size: 13px; margin-top: 14px; min-height: 18px; display: flex; align-items: center; gap: 7px; }
        .msg:empty { display: none; }
        .msg.error { color: var(--danger); }
        .msg.success { color: var(--ok); }

        .footer {
            display: flex; align-items: center; justify-content: center; gap: 7px;
            color: var(--faint); font-size: 12px; margin-top: 24px;
        }
        .footer .live { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); animation: blink 1.8s infinite; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
        a { color: var(--accent); }

        @media (max-width: 560px) {
            .card { padding: 20px; }
            .add-row { flex-direction: column; }
            .add-row button { width: 100%; }
            .stat { min-width: 0; }
        }
    </style>
</head>
<body>
    <div class="logo">
        <span class="badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        </span>
        <span>Auto Pinger<small class="wave">Keep your services awake</small></span>
    </div>

    <div id="login-card" class="card">
        <h2>Welcome back</h2>
        <p class="sub">Enter your password to manage your pinged services.</p>
        <label for="password">Password</label>
        <div class="field">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <button class="btn-primary btn-block" id="login-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
            Sign in
        </button>
        <div class="msg error" id="login-msg"></div>
    </div>

    <div id="app" class="card hidden">
        <div class="topbar">
            <h2>Pinged URLs</h2>
            <button class="btn-ghost" id="logout-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Log out
            </button>
        </div>

        <div class="stats">
            <div class="stat"><div class="num" id="stat-total">0</div><div class="lbl">Total</div></div>
            <div class="stat active"><div class="num" id="stat-active">0</div><div class="lbl">Active</div></div>
            <div class="stat paused"><div class="num" id="stat-paused">0</div><div class="lbl">Paused</div></div>
        </div>

        <div class="add-row">
            <div class="field">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                <input type="url" id="new-url" placeholder="https://your-backend.onrender.com" />
            </div>
            <button class="btn-primary" id="add-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Add URL
            </button>
        </div>
        <div class="msg" id="app-msg"></div>

        <div class="toolbar">
            <button class="btn-ghost" id="ping-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                Ping all now
            </button>
            <div class="spacer"></div>
            <button class="btn-icon" id="refresh-btn" title="Refresh">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            </button>
        </div>

        <ul id="url-list"></ul>
        <div class="empty hidden" id="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
            <div class="title">No URLs yet</div>
            <div class="desc">Add your first service above to keep it awake.</div>
        </div>

        <div class="footer"><span class="live"></span> Cron pings every minute automatically</div>
    </div>

    <script>
        const TOKEN_KEY = "pinger_token";
        const $ = (id) => document.getElementById(id);

        const getToken = () => localStorage.getItem(TOKEN_KEY);
        const setToken = (t) => localStorage.setItem(TOKEN_KEY, t);
        const clearToken = () => localStorage.removeItem(TOKEN_KEY);

        const authHeaders = () => ({
            "Content-Type": "application/json",
            "Authorization": "Bearer " + getToken(),
        });

        const showMsg = (el, text, type) => {
            el.textContent = text;
            el.className = "msg" + (type ? " " + type : "");
        };

        async function api(path, options = {}) {
            const res = await fetch(path, options);
            if (res.status === 401) {
                clearToken();
                showApp(false);
                throw new Error("Session expired. Please sign in again.");
            }
            return res;
        }

        function showApp(loggedIn) {
            $("login-card").classList.toggle("hidden", loggedIn);
            $("app").classList.toggle("hidden", !loggedIn);
            if (loggedIn) loadUrls();
        }

        async function login() {
            const password = $("password").value;
            showMsg($("login-msg"), "", "");
            $("login-btn").disabled = true;
            try {
                const res = await fetch("/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ password }),
                });
                if (!res.ok) {
                    const data = await res.json().catch(() => ({}));
                    throw new Error(data.error || "Login failed");
                }
                const data = await res.json();
                setToken(data.token);
                $("password").value = "";
                showApp(true);
            } catch (err) {
                showMsg($("login-msg"), err.message, "error");
            } finally {
                $("login-btn").disabled = false;
            }
        }

        function logout() {
            clearToken();
            showApp(false);
        }

        let currentUrls = [];

        function updateStats() {
            const total = currentUrls.length;
            const active = currentUrls.filter((u) => u.enabled !== false).length;
            $("stat-total").textContent = total;
            $("stat-active").textContent = active;
            $("stat-paused").textContent = total - active;
        }

        function renderUrls(pingResults) {
            const list = $("url-list");
            list.innerHTML = "";
            updateStats();
            if (!currentUrls.length) {
                $("empty-state").classList.remove("hidden");
                return;
            }
            $("empty-state").classList.add("hidden");
            for (const item of currentUrls) {
                const enabled = item.enabled !== false;
                const li = document.createElement("li");
                li.className = "url-item" + (enabled ? "" : " disabled");

                const dot = document.createElement("span");
                dot.className = "dot";

                const main = document.createElement("div");
                main.className = "url-main";
                const url = document.createElement("div");
                url.className = "url";
                url.textContent = item.url;
                const meta = document.createElement("div");
                meta.className = "meta";

                if (!enabled) {
                    dot.classList.add("paused");
                    meta.innerHTML = '<span class="pill paused">Paused</span> Not being pinged';
                } else {
                    let result = null;
                    if (pingResults) result = pingResults.find((p) => p.url === item.url);
                    if (result) {
                        dot.classList.add(result.ok ? "ok" : "fail");
                        meta.innerHTML = result.ok
                            ? '<span class="pill ok">' + result.status + '</span> Responded OK'
                            : '<span class="pill fail">Failed</span> ' + (result.error || "error");
                    } else if (typeof item.lastOk === "boolean") {
                        dot.classList.add(item.lastOk ? "ok" : "fail");
                        const when = item.lastPingedAt ? new Date(item.lastPingedAt).toLocaleString() : "";
                        meta.innerHTML = item.lastOk
                            ? '<span class="pill ok">' + item.lastStatus + '</span> Last OK ' + when
                            : '<span class="pill fail">Failed</span> ' + (item.lastError || "error") + (when ? ' \u00b7 ' + when : '');
                    } else {
                        meta.textContent = "Added " + new Date(item.createdAt).toLocaleString();
                    }
                }

                main.appendChild(url);
                main.appendChild(meta);

                const actions = document.createElement("div");
                actions.className = "actions";

                const toggle = document.createElement("button");
                toggle.className = "switch" + (enabled ? " on" : "");
                toggle.title = enabled ? "Disable" : "Enable";
                const knob = document.createElement("span");
                knob.className = "knob";
                toggle.appendChild(knob);
                toggle.onclick = () => toggleUrl(item._id, !enabled);

                const del = document.createElement("button");
                del.className = "btn-icon danger";
                del.title = "Remove";
                del.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
                del.onclick = () => removeUrl(item._id);

                actions.appendChild(toggle);
                actions.appendChild(del);

                li.appendChild(dot);
                li.appendChild(main);
                li.appendChild(actions);
                list.appendChild(li);
            }
        }

        async function loadUrls() {
            try {
                const res = await api("/list-urls", { headers: authHeaders() });
                currentUrls = await res.json();
                renderUrls(null);
            } catch (err) {
                showMsg($("app-msg"), err.message, "error");
            }
        }

        async function addUrl() {
            const input = $("new-url");
            const url = input.value.trim();
            if (!url) return;
            $("add-btn").disabled = true;
            showMsg($("app-msg"), "", "");
            try {
                const res = await api("/add-url", {
                    method: "POST",
                    headers: authHeaders(),
                    body: JSON.stringify({ url }),
                });
                if (!res.ok) throw new Error(await res.text());
                input.value = "";
                showMsg($("app-msg"), "URL added.", "success");
                await loadUrls();
            } catch (err) {
                showMsg($("app-msg"), err.message, "error");
            } finally {
                $("add-btn").disabled = false;
            }
        }

        async function toggleUrl(id, enabled) {
            try {
                const res = await api("/toggle-url/" + id, {
                    method: "PATCH",
                    headers: authHeaders(),
                    body: JSON.stringify({ enabled }),
                });
                if (!res.ok) throw new Error(await res.text());
                showMsg($("app-msg"), enabled ? "URL enabled." : "URL disabled.", "success");
                await loadUrls();
            } catch (err) {
                showMsg($("app-msg"), err.message, "error");
            }
        }

        async function removeUrl(id) {
            if (!confirm("Remove this URL?")) return;
            try {
                const res = await api("/remove-url/" + id, {
                    method: "DELETE",
                    headers: authHeaders(),
                });
                if (!res.ok) throw new Error(await res.text());
                showMsg($("app-msg"), "URL removed.", "success");
                await loadUrls();
            } catch (err) {
                showMsg($("app-msg"), err.message, "error");
            }
        }

        async function pingNow() {
            $("ping-btn").disabled = true;
            showMsg($("app-msg"), "Pinging all URLs...", "");
            try {
                const res = await api("/ping-now", {
                    method: "POST",
                    headers: authHeaders(),
                });
                if (!res.ok) throw new Error(await res.text());
                const results = await res.json();
                renderUrls(results);
                const okCount = results.filter((r) => r.ok).length;
                showMsg($("app-msg"), okCount + "/" + results.length + " responded OK.", "success");
            } catch (err) {
                showMsg($("app-msg"), err.message, "error");
            } finally {
                $("ping-btn").disabled = false;
            }
        }

        $("login-btn").onclick = login;
        $("password").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
        $("logout-btn").onclick = logout;
        $("add-btn").onclick = addUrl;
        $("new-url").addEventListener("keydown", (e) => { if (e.key === "Enter") addUrl(); });
        $("refresh-btn").onclick = loadUrls;
        $("ping-btn").onclick = pingNow;

        showApp(!!getToken());
    </script>
</body>
</html>
